<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final Review</title>
<style>
:root{--bg:#000;--cyan:#5ad8e8;--mute:#8d9b9e;--line:#1b2527;--font:"Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:#fff;font-family:var(--font);overflow:hidden}
button,select,input{font-family:inherit}

/* ---------- modes ---------- */
body.mode-edit #deck,body.mode-edit .zone,body.mode-edit #editbtn,body.mode-edit #empty{display:none}
body.mode-present #editor{display:none}

/* ---------- presentation ---------- */
#deck{position:fixed;inset:0;perspective:2000px}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);visibility:hidden;container-type:size}
.slide.active{visibility:visible;z-index:2}
.slide.leaving{visibility:visible;z-index:1}
.slide img,.slide video{width:100%;height:100%;object-fit:contain;display:block}
.slide canvas.vec{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
.slide.vec-on img{visibility:hidden}
.slide.missing img,.slide.missing video{display:none}
.slide.missing::after{content:"Missing file: " attr(data-f);color:var(--mute);font-size:clamp(11px,1.2vw,16px);letter-spacing:.12em;text-transform:uppercase}
/* scrollbars: black track, glowing gradient thumb, no arrow buttons */
::-webkit-scrollbar{width:16px;height:16px}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-thumb{min-height:150px;border:0;background-repeat:no-repeat;
  background-image:
    radial-gradient(circle closest-side,#5AD8E8 96%,rgba(90,216,232,0) 100%),
    radial-gradient(circle closest-side,#DC24F4 96%,rgba(220,36,244,0) 100%),
    linear-gradient(180deg,#5AD8E8 0%,#6f5cf2 55%,#DC24F4 100%),
    radial-gradient(closest-side,rgba(220,36,244,.62) 0%,rgba(220,36,244,.4) 62%,rgba(220,36,244,0) 100%);
  background-size:8px 8px,8px 8px,8px calc(100% - 88px),100% calc(100% - 64px);
  background-position:50% 40px,50% calc(100% - 40px),50% 50%,50% 50%}
::-webkit-scrollbar-thumb:hover{background-image:
    radial-gradient(circle closest-side,#8be8f4 96%,rgba(139,232,244,0) 100%),
    radial-gradient(circle closest-side,#f060ff 96%,rgba(240,96,255,0) 100%),
    linear-gradient(180deg,#8be8f4 0%,#8a78ff 55%,#f060ff 100%),
    radial-gradient(closest-side,rgba(240,96,255,.85) 0%,rgba(220,36,244,.55) 62%,rgba(220,36,244,0) 100%)}
::-webkit-scrollbar-corner{background:#000}
@supports not selector(::-webkit-scrollbar){*{scrollbar-color:#DC24F4 #000}}
.zone{position:fixed;top:0;bottom:12vh;width:14vw;z-index:4;cursor:pointer;background:none;border:0}
#prev{left:0}#next{right:0}
#editbtn{position:fixed;left:2vmin;top:2vmin;z-index:6;opacity:0;transition:opacity .3s}
#editbtn.show{opacity:1}
#empty{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:var(--mute);letter-spacing:.2em;text-transform:uppercase;font-size:14px}

/* transitions (the incoming slide decides) */
.active[data-tr="none"]{animation:none}
.active[data-tr="fade"]{animation:fi .8s ease both}
.active[data-tr="zoom"]{animation:zi .9s cubic-bezier(.2,.7,.2,1) both}
.active[data-tr="slide"]{animation:si .8s cubic-bezier(.7,0,.2,1) both}
.active[data-tr="rise"]{animation:ri .8s cubic-bezier(.7,0,.2,1) both}
.active[data-tr="wipe"]{animation:wi .9s cubic-bezier(.7,0,.2,1) both}
.active[data-tr="blur"]{animation:bi .9s ease both}
.active[data-tr="flip"]{animation:fli .9s cubic-bezier(.2,.7,.2,1) both}
.leaving[data-tr="slide"]{animation:so .8s cubic-bezier(.7,0,.2,1) both}
.leaving[data-tr="rise"]{animation:ro .8s cubic-bezier(.7,0,.2,1) both}
.leaving[data-tr="zoom"]{animation:zo .9s ease both}
.leaving[data-tr="flip"]{animation:flo .9s ease both}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes zi{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes zo{to{opacity:0;transform:scale(1.08)}}
@keyframes si{from{transform:translateX(calc(var(--dir) * 100%))}to{transform:none}}
@keyframes so{to{transform:translateX(calc(var(--dir) * -30%));opacity:.3}}
@keyframes ri{from{transform:translateY(100%)}to{transform:none}}
@keyframes ro{to{transform:translateY(-30%);opacity:.3}}
@keyframes wi{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes bi{from{opacity:0;filter:blur(28px)}to{opacity:1;filter:none}}
@keyframes fli{from{transform:rotateY(-90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes flo{to{transform:rotateY(90deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.slide{animation-duration:.01ms!important}}

/* ---------- editor ---------- */
#editor{position:fixed;inset:0;display:flex;flex-direction:column;background:#050707}
#editor header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;font-style:italic;text-transform:uppercase;letter-spacing:-.02em;margin-right:8px}
.brand span{color:var(--cyan)}
.btn{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);background:none;border:1px solid var(--cyan);padding:8px 12px;cursor:pointer}
.btn:hover{background:var(--cyan);color:#000}
.btn.primary{background:var(--cyan);color:#000;font-weight:700}
.btn.warn{border-color:#DC24F4;color:#DC24F4}
.btn.warn:hover{background:#DC24F4;color:#000}
.btn[disabled]{opacity:.35;pointer-events:none}
#editor label.f{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:6px}
select{background:#0a0f10;color:#fff;border:1px solid #2a3639;padding:7px 8px;font-size:13px}
#status{margin-left:auto;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
#status.err{color:#DC24F4}
.work{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0}
#grid{overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;align-content:start}
.card{border:1px solid #243033;background:#0a0f10;cursor:grab;position:relative;user-select:none}
.card.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.card .th{aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center;pointer-events:none;position:relative}
.card .th img,.card .th video{width:100%;height:100%;object-fit:contain}
.card.missing .th img,.card.missing .th video{display:none}
.card.missing .th::after{content:"missing file";color:#DC24F4;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.card .meta{display:flex;gap:8px;align-items:center;padding:6px 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.card .meta b{color:#fff}
.card .meta i{font-style:normal;color:var(--cyan)}
.card .meta em{margin-left:auto;font-style:normal}
.card .meta em.cu{color:var(--cyan)}
.card.dropb::before,.card.dropa::after{content:"";position:absolute;top:-2px;bottom:-2px;width:4px;background:var(--cyan)}
.card.dropb::before{left:-8px}.card.dropa::after{right:-8px}
#insp{border-left:1px solid var(--line);padding:14px;overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:10px}
#insp h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
#insp label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
#insp label.chk{display:flex;gap:8px;align-items:center;color:#cfd8da;text-transform:none;letter-spacing:0;font-size:13px}
#insp select{width:100%}
#insp .pv{aspect-ratio:16/9;background:#000;border:1px solid #243033}
#insp .pv img,#insp .pv video{width:100%;height:100%;object-fit:contain;display:block}
#insp .row{display:flex;gap:8px}#insp .row .btn{flex:1}
#insp .dim,#insp li{color:var(--mute);line-height:1.5}
#insp ul{padding-left:18px;display:flex;flex-direction:column;gap:6px}
#drop{position:fixed;inset:10px;border:2px dashed var(--cyan);background:rgba(90,216,232,.07);display:none;align-items:center;justify-content:center;font-size:18px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);z-index:20;pointer-events:none}
#drop.on{display:flex}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
#busy.on{display:flex}
.pbar{width:min(420px,70vw);height:4px;background:#1b2527}.pbar i{display:block;height:100%;width:0;background:var(--cyan)}
#toast{position:fixed;left:14px;bottom:14px;max-width:min(520px,90vw);background:#0a0f10;border:1px solid var(--cyan);padding:10px 14px;font-size:13px;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
/* video placed on top of a slide: the stage matches the page area exactly */
.stage-ov{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);aspect-ratio:var(--ar,1.7778);width:min(100cqw,calc(100cqh * var(--ar,1.7778)));z-index:3;pointer-events:none}
.stage-ov .ov{position:absolute;overflow:hidden;pointer-events:auto;background:#000}
.stage-ov .ov video{position:absolute;display:block;object-fit:fill;max-width:none;max-height:none}
.stage-ov .ov.missing::after{content:"video missing";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#DC24F4;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
/* slide arranger */
#arr{position:fixed;inset:0;z-index:25;background:#050707;display:none;flex-direction:column}
#arr.on{display:flex}
#arr header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.arrwork{flex:1;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) 290px;min-height:0}
#arrCanvas{position:relative;container-type:size;margin:14px;background:#0a0f10;border:1px solid #1b2527;min-height:0}
#arrSide{border-left:1px solid var(--line);padding:14px;overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:10px}
#arrSide h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
#arrSide label.chk{display:flex;gap:8px;align-items:center;color:#cfd8da;font-size:13px}
#arrSide .dim{color:var(--mute);line-height:1.5}
#arrSide .row{display:flex;gap:8px}#arrSide .row .btn{flex:1}
#arrSide .ovitem{border:1px solid #243033;padding:8px 10px;cursor:pointer;color:#cfd8da;word-break:break-all}
#arrSide .ovitem.sel{border-color:var(--cyan);color:#fff}
.ovw{position:absolute;cursor:move;touch-action:none;pointer-events:auto;outline:1px dashed rgba(90,216,232,.7)}
.ovw.sel{outline:2px solid var(--cyan)}
.ovw .ov{position:absolute;inset:0;overflow:hidden}
.hd{position:absolute;width:13px;height:13px;margin:-7px 0 0 -7px;border:1px solid #000;touch-action:none;z-index:5}
.hd.c{background:var(--cyan)}.hd.e{background:#fff}
.hd-nw{left:0;top:0;cursor:nwse-resize}.hd-ne{left:100%;top:0;cursor:nesw-resize}.hd-se{left:100%;top:100%;cursor:nwse-resize}.hd-sw{left:0;top:100%;cursor:nesw-resize}
.hd-n{left:50%;top:0;cursor:ns-resize}.hd-s{left:50%;top:100%;cursor:ns-resize}.hd-w{left:0;top:50%;cursor:ew-resize}.hd-e{left:100%;top:50%;cursor:ew-resize}
@media (max-width:820px){.work{grid-template-columns:1fr}#insp{display:none}}
</style>
</head>
<body class="mode-present">

<!-- presentation -->
<div id="deck"></div>
<button class="zone" id="prev" tabindex="-1" aria-label="Previous slide"></button>
<button class="zone" id="next" tabindex="-1" aria-label="Next slide"></button>
<button class="btn" id="editbtn">Edit</button>
<div id="empty">No slides yet</div>

<!-- editor -->
<div id="editor">
  <header>
    <div class="brand">Final review <span>/ Editor</span></div>
    <button class="btn" id="folderBtn">Connect folder</button>
    <button class="btn" id="scanBtn">Scan for PDFs</button>
    <button class="btn" id="addPdf">+ PDF</button>
    <button class="btn" id="addMedia">+ Video / GIF / image</button>
    <label class="f">Default transition <select id="defTr"></select></label>
    <label class="f">Placeholder image
      <select id="quality">
        <option value="jpg-2560">JPG 2560 px</option>
        <option value="png-3840">PNG 3840 px (large)</option>
        <option value="jpg-1920">JPG 1920 px (small)</option>
      </select>
    </label>
    <button class="btn" id="undoBtn">Undo</button>
    <span id="status"></span>
    <button class="btn primary" id="presentBtn">Present</button>
  </header>
  <div class="work">
    <div id="grid"></div>
    <aside id="insp"></aside>
  </div>
</div>
<div id="arr">
  <header>
    <div class="brand">Slide <span id="arrNum"></span> <span>/ Videos on top</span></div>
    <button class="btn primary" id="arrDone">Done</button>
    <button class="btn" id="arrAdd">+ Add video file</button>
    <label class="f">or use an imported video <select id="arrExisting"><option value="">Choose...</option></select></label>
    <span id="arrHint" style="margin-left:auto;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)">Drag to move. Cyan squares resize. White squares crop.</span>
  </header>
  <div class="arrwork"><div id="arrCanvas"><div id="arrStage" class="stage-ov"></div></div><aside id="arrSide"></aside></div>
</div>
<div id="drop">Drop PDFs, videos, GIFs or images</div>
<div id="busy"><div id="busyTxt"></div><div class="pbar"><i id="pfill"></i></div></div>
<div id="toast"></div>
<input type="file" id="pdfIn" accept="application/pdf" multiple hidden>
<input type="file" id="mediaIn" accept="video/*,image/*" multiple hidden>
<input type="file" id="ovIn" accept="video/*" hidden>

<script src="slides.js"></script>
<script>
const $ = id => document.getElementById(id);
const TR = [["none","None"],["fade","Fade"],["slide","Push"],["rise","Rise"],["zoom","Zoom"],["wipe","Wipe"],["blur","Blur"],["flip","Flip"]];
const trName = v => (TR.find(t=>t[0]===v)||[,v])[1];
const CAN_EDIT = location.protocol==="file:" || /[?&]edit\b/.test(location.search) || ["localhost","127.0.0.1"].includes(location.hostname);
let deckData = DECK;
if(!deckData.slides) deckData.slides = [];
const SL = () => deckData.slides;
const effTr = s => s.tr || deckData.transition || "fade";

/* ---------- videos placed on top of a slide ----------
   Each overlay stores the FULL video rectangle (x,y,w,h as fractions of the page area)
   plus how much is cropped away from each side (cl,ct,cr,cb as fractions of the video). */
function ovGeom(o){
  const l=o.cl||0, t=o.ct||0, r=o.cr||0, b=o.cb||0;
  return {l,t,r,b, vx:o.x+l*o.w, vy:o.y+t*o.h, vw:o.w*(1-l-r), vh:o.h*(1-t-b)};
}
function applyBox(el,o){ const g=ovGeom(o); el.style.left=g.vx*100+"%"; el.style.top=g.vy*100+"%"; el.style.width=g.vw*100+"%"; el.style.height=g.vh*100+"%"; }
function applyVid(v,o){
  const g=ovGeom(o), kx=1-g.l-g.r, ky=1-g.t-g.b;
  v.style.width=(100/kx)+"%"; v.style.height=(100/ky)+"%"; v.style.left=(-g.l/kx*100)+"%"; v.style.top=(-g.t/ky*100)+"%";
}
function makeOverlay(o){
  const d=document.createElement("div"); d.className="ov"; applyBox(d,o);
  const v=document.createElement("video");
  v.src=o.video; v.playsInline=true; v.preload="auto"; v.muted=o.muted!==false; v.loop=!!o.loop; v.controls=!!o.controls;
  v.dataset.auto = o.autoplay!==false ? "1" : "0";
  applyVid(v,o); v.onerror=()=>d.classList.add("missing");
  d.appendChild(v); return d;
}

/* ======================= PRESENTATION ======================= */
const deckEl = $("deck");
let els = [], cur = -1;

function buildDeck(){
  deckEl.innerHTML = "";
  els = SL().map(s=>{
    const e = document.createElement("section");
    e.className = "slide"; e.dataset.tr = effTr(s); e.dataset.f = s.img || s.video;
    deckEl.appendChild(e); return e;
  });
  cur = -1;
}
function load(i){
  if(i<0 || i>=SL().length) return;
  const e = els[i], s = SL()[i];
  if(e.dataset.loaded) return;
  e.dataset.loaded = 1;
  const m = document.createElement(s.video ? "video" : "img");
  if(s.video){ m.playsInline = true; m.controls = true; m.preload = "auto"; m.muted = !!s.muted; m.loop = !!s.loop; }
  else m.alt = "";
  if(s.video) m.dataset.auto = s.autoplay !== false ? "1" : "0";
  m.onerror = () => e.classList.add("missing");
  m.src = s.img || s.video;
  e.appendChild(m);
  if(!s.video && s.overlays && s.overlays.length){
    const st = document.createElement("div"); st.className = "stage-ov"; st.style.setProperty("--ar", s.ar || 1.7778);
    s.overlays.forEach(o=>st.appendChild(makeOverlay(o)));
    m.addEventListener("load", ()=>{ if(!s.ar && m.naturalWidth) st.style.setProperty("--ar", m.naturalWidth/m.naturalHeight); });
    e.appendChild(st);
  }
}
function stopVideos(e){ e.querySelectorAll("video").forEach(v=>{ v.pause(); v.currentTime = 0; }); }
/* ---------- crisp vector rendering of PDF slides ----------
   The slide image is only a placeholder. The real PDF page is drawn at the
   exact pixel size of the screen, so lines and text stay sharp at any resolution. */
const pdfDocs = new Map();
let vecChain = Promise.resolve();
async function readProjectFile(path){
  let d = dir; const parts = path.split("/");
  for(let k=0;k<parts.length-1;k++) d = await d.getDirectoryHandle(parts[k]);
  return (await (await d.getFileHandle(parts[parts.length-1])).getFile()).arrayBuffer();
}
async function viaHandle(path){
  if(!dir || await dir.queryPermission({mode:"read"})!=="granted") throw new Error("no file access");
  return pdfjsLib.getDocument({data:new Uint8Array(await readProjectFile(path))}).promise;
}
function getPdfDoc(path){
  if(!pdfDocs.has(path)) pdfDocs.set(path, (async()=>{
    await loadPdfJs();
    if(location.protocol==="file:") return viaHandle(path);
    try{ return await pdfjsLib.getDocument({url:encodeURI(path)}).promise; }
    catch(e){ return viaHandle(path); }
  })().catch(e=>{ pdfDocs.delete(path); throw e; }));
  return pdfDocs.get(path);
}
function queueVec(i){ vecChain = vecChain.then(()=>renderVec(i)).catch(()=>{}); }
async function renderVec(i){
  const e = els[i], s = SL()[i];
  if(!e || !s || !s.pdf || !document.body.classList.contains("mode-present")) return;
  const W = deckEl.clientWidth, H = deckEl.clientHeight, dpr = window.devicePixelRatio || 1;
  const key = W+"x"+H+"@"+dpr;
  if(e._vk === key) return;
  let page;
  try{ page = await (await getPdfDoc(s.pdf)).getPage(s.page || 1); }catch(err){ e._vk = null; return; }
  const v1 = page.getViewport({scale:1});
  const fit = Math.min(W/v1.width, H/v1.height);
  const stg = e.querySelector(".stage-ov"); if(stg) stg.style.setProperty("--ar", v1.width/v1.height);
  let scale = fit*dpr;
  scale = Math.min(scale, 8192/v1.width, 8192/v1.height, Math.sqrt(48e6/(v1.width*v1.height)));
  const vp = page.getViewport({scale});
  const cv = document.createElement("canvas");
  cv.className = "vec"; cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
  cv.style.width = (v1.width*fit)+"px"; cv.style.height = (v1.height*fit)+"px";
  const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,cv.width,cv.height);
  try{ await page.render({canvasContext:ctx, viewport:vp}).promise; }catch(err){ return; }
  if(!e.isConnected) return;
  const old = e.querySelector("canvas.vec"); if(old){ old.width = old.height = 0; old.remove(); }
  e.appendChild(cv); e.classList.add("vec-on"); e._vk = key;
}
function releaseVec(e){ const c = e.querySelector("canvas.vec"); if(c){ c.width = c.height = 0; c.remove(); } e.classList.remove("vec-on"); e._vk = null; }
function vecWindow(n){
  els.forEach((e,k)=>{ if(e._vk && (k<n-1 || k>n+3)) releaseVec(e); });
  [n,n+1,n+2,n-1,n+3].forEach(k=>{ if(els[k] && SL()[k] && SL()[k].pdf && !els[k]._vk) queueVec(k); });
}
let rsT;
addEventListener("resize", ()=>{
  clearTimeout(rsT);
  rsT = setTimeout(()=>{ if(document.body.classList.contains("mode-present") && cur>=0){ els.forEach(e=>{ if(e._vk) e._vk = null; }); vecWindow(cur); } }, 250);
});
async function askRead(){
  try{
    if(dir && location.protocol==="file:" && await dir.queryPermission({mode:"read"})==="prompt"){
      await dir.requestPermission({mode:"read"});
      if(cur>=0) dispatchEvent(new Event("resize"));
    }
  }catch(e){}
}
function go(n, dir){
  const S = SL();
  n = Math.max(0, Math.min(S.length-1, n));
  if(n === cur) return;
  dir = dir || (n > cur ? 1 : -1);
  const prev = els[cur], nxt = els[n];
  document.documentElement.style.setProperty("--dir", dir);
  for(let k=n-1;k<=n+3;k++) load(k);
  if(prev){
    prev.classList.remove("active"); prev.classList.add("leaving");
    prev.dataset.tr = nxt.dataset.tr;
    setTimeout(()=>{ if(prev!==els[cur]){ prev.classList.remove("leaving"); stopVideos(prev); } }, 950);
  }

const idb = () => new Promise((res,rej)=>{ const r=indexedDB.open("deck-editor",1); r.onupgradeneeded=()=>r.result.createObjectStore("k"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });

async function updateFolder(){

async function connectFolder(scan){
  if(!window.showDirectoryPicker) return toast("Editing needs Chrome or Edge. Presenting works in any browser.");
  try{
    if(dir && dirState==="prompt"){
      if(await dir.requestPermission({mode:"readwrite"})==="granted"){ await updateFolder(); setStatus("Connected"); if(scan) await scanFolder(); return; }
    }

/* Finds every PDF in the connected folder (and up to 2 levels of subfolders, skipping assets/)
   and adds the ones that were not imported before. */
async function scanFolder(){
  if(!await ready()) return;
  busy("Looking for PDFs...", 0);
  try{
    const found = [];
    async function walk(d, path, depth){
      for await (const [name,h] of d.entries()){
        if(h.kind==="directory"){
          if(depth<2 && name.toLowerCase()!=="assets" && name[0]!=="." && name!=="node_modules") await walk(h, path+name+"/", depth+1);
        }else if(/\.pdf$/i.test(name)){
          const f = await h.getFile();
          found.push({file:f, path:path+name, key:name+"|"+f.size});
        }
      }
    }
    await walk(dir,"",0);
    found.sort((a,b)=>a.path.localeCompare(b.path,undefined,{numeric:true,sensitivity:"base"}));
    if(!found.length){ unbusy(); toast("No PDFs found in this folder. Put your PDFs in it (or in a subfolder) and click Scan for PDFs."); return; }
    if(!deckData.sources) deckData.sources = [];
    const done = new Set(deckData.sources.map(s=>s.key));
    const fresh = found.filter(x=>!done.has(x.key));
    if(!fresh.length){ unbusy(); toast("Found "+found.length+" PDF"+(found.length>1?"s":"")+", all already added."); return; }
    snap();
    let at = SL().length;
    for(const x of fresh){
      at = await importPdf(x.file, at, x.path);
      deckData.sources.push({key:x.key, name:x.path});
    }
    sel = new Set(); anchor = -1;
    toast("Added "+fresh.length+" PDF"+(fresh.length>1?"s":"")+" to the workspace.");
  }catch(e){ console.error(e); toast("Scan failed: "+e.message); }
  finally{ unbusy(); renderGrid(); renderInsp(); save(); }
}
$("scanBtn").onclick = () => { if(!needsFolder()) scanFolder(); };
const WRONG = "The connected folder is not your presentation folder (it has no index.html). Click Connect folder and choose the folder that contains index.html.";
async function validRoot(){

    return true;
  }
}
async function ready(){
  if(!window.showDirectoryPicker){ toast("Editing needs Chrome or Edge."); return false; }
  if(!dir){ toast("Connect your project folder first."); return false; }
  if(await dir.queryPermission({mode:"readwrite"})!=="granted"){
    if(await dir.requestPermission({mode:"readwrite"})!=="granted"){ toast("Folder access was not granted."); return false; }
    updateFolder();
  }
  if(!await validRoot()){ toast(WRONG); return false; }
  ensureLib();
  return true;
}
async function sub(path){ let d=dir; for(const p of path.split("/")) d = await d.getDirectoryHandle(p,{create:true}); return d; }
async function exists(d,name){ try{ await d.getFileHandle(name); return true; }catch(e){ return false; } }
async function uniq(d,base,ext){ let n=base+ext,k=2; while(await exists(d,n)) n=`${base}-${k++}${ext}`; return n; }
async function putBlob(d,name,blob){
  const fh = await d.getFileHandle(name,{create:true});
  const w = await fh.createWritable();
  await blob.stream().pipeTo(w);
}
const slug = s => s.toLowerCase().replace(/\.[^.]+$/,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "file";

let pdfReady = null;
const CDN = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
function loadPdfJs(){
  if(pdfReady) return pdfReady;
  const tag = src => new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>{ s.remove(); rej(new Error("load failed: "+src)); }; document.head.appendChild(s); });
  pdfReady = (async()=>{
    let base = "lib/";
    try{ await tag(base+"pdf.min.js"); }catch(e){ base = CDN; await tag(base+"pdf.min.js"); }
    try{
      const r = await fetch(base+"pdf.worker.min.js"); if(!r.ok) throw new Error("worker");
      pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([await r.text()],{type:"text/javascript"}));
    }catch(e){ pdfjsLib.GlobalWorkerOptions.workerSrc = base+"pdf.worker.min.js"; }
  })().catch(e=>{ pdfReady = null; throw new Error("Could not load the PDF library. Check your internet connection."); });
  return pdfReady;
}
/* Saves the PDF engine into the project (lib/) once, so the published site does not depend on a CDN. */
let libBusy = false;
async function ensureLib(){
  if(libBusy) return; libBusy = true;
  try{
    if(!dir || await dir.queryPermission({mode:"readwrite"})!=="granted") return;
    const d = await sub("lib"); let wrote = false;
    for(const n of ["pdf.min.js","pdf.worker.min.js"]){
      if(await exists(d,n)) continue;
      const r = await fetch(CDN+n); if(!r.ok) throw new Error(n+" "+r.status);
      await putBlob(d,n,await r.blob()); wrote = true;
    }
    if(wrote) toast("Saved the PDF engine into your project (lib folder) so the site works offline.");
  }catch(e){ console.warn("ensureLib", e); }
  finally{ libBusy = false; }
}
const insertPos = () => sel.size ? Math.max(...sel)+1 : SL().length;

async function importPdf(file, at, pdfPath){
  await loadPdfJs();
  const [fmt,wpx] = $("quality").value.split("-");
  const W = +wpx, H = Math.round(W*9/16);
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  const d = await sub("assets/pages"), base = slug(file.name);
  for(let p=1;p<=pdf.numPages;p++){
    busy(`${file.name}: page ${p} of ${pdf.numPages}`, p/pdf.numPages);
    const page = await pdf.getPage(p);
    const v1 = page.getViewport({scale:1});
    const vp = page.getViewport({scale: Math.min(W/v1.width, H/v1.height)});
    const cv = document.createElement("canvas");
    cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,cv.width,cv.height);
    await page.render({canvasContext:ctx, viewport:vp}).promise;
    const blob = await new Promise(r=>cv.toBlob(r, fmt==="png"?"image/png":"image/jpeg", .92));
    const name = await uniq(d, `${base}-p${String(p).padStart(3,"0")}`, fmt==="png"?".png":".jpg");
    await putBlob(d,name,blob);
    SL().splice(at++,0,{img:"assets/pages/"+name, pdf:pdfPath, page:p, ar:+(v1.width/v1.height).toFixed(5)});
    try{ page.cleanup(); }catch(e){} cv.width = cv.height = 0;
  }
  try{ if(pdf.destroy) await pdf.destroy(); }catch(e){}
  renderGrid();
  return at;
}
async function importMedia(file, at, isVideo){
  busy("Copying "+file.name+"...", .5);
  const d = await sub("assets/media");
  const ext = (file.name.match(/\.[^.]+$/)||[""])[0].toLowerCase();
  const name = await uniq(d, slug(file.name), ext);
  await putBlob(d,name,file);
  SL().splice(at++,0, isVideo ? {video:"assets/media/"+name, autoplay:true} : {img:"assets/media/"+name});
  if(file.size > 95*1024*1024) toast(file.name+" is over 95 MB. GitHub rejects files over 100 MB, so compress it before publishing.");
  renderGrid();
  return at;
}
async function handleFiles(list){
  const files = [...list];
  if(!files.length || !await ready()) return;
  snap();
  let at = insertPos();
  try{
    for(const f of files){
      if(f.type==="application/pdf" || /\.pdf$/i.test(f.name)){
        const pd = await sub("assets/pdfs"), pn = await uniq(pd, slug(f.name), ".pdf");
        busy("Copying "+f.name+"...", .2); await putBlob(pd, pn, f);
        at = await importPdf(f, at, "assets/pdfs/"+pn);
        if(!deckData.sources) deckData.sources = [];
        deckData.sources.push({key:f.name+"|"+f.size, name:f.name});
      }
      else if(f.type.startsWith("video/") || /\.(mp4|webm|mov|m4v|ogv)$/i.test(f.name)) at = await importMedia(f,at,true);
      else if(f.type.startsWith("image/")) at = await importMedia(f,at,false);
      else toast("Skipped "+f.name);
    }
  }catch(e){ console.error(e); toast("Import failed: "+e.message); }
  finally{ unbusy(); renderGrid(); renderInsp(); save(); }
}

/* ---------- grid ---------- */
function renderGrid(){
  const g = $("grid"), st = g.scrollTop; g.innerHTML = "";
  SL().forEach((s,i)=>{
    const c = document.createElement("div");
    c.className = "card" + (sel.has(i)?" sel":""); c.draggable = true; c.dataset.i = i;
    let kind = s.video ? "Video" : s.pdf ? "PDF" : /\.gif$/i.test(s.img) ? "GIF" : "";
    const ovn = (s.overlays||[]).length; if(ovn) kind += (kind?" + ":"")+ovn+" vid";
    c.innerHTML = `<div class="th">${s.video?`<video src="${s.video}#t=0.1" preload="metadata" muted></video>`:`<img src="${s.img}" loading="lazy" alt="">`}</div>
      <div class="meta"><b>${String(i+1).padStart(2,"0")}</b><i>${kind}</i><em class="${s.tr?"cu":""}">${trName(effTr(s))}</em></div>`;
    c.querySelector("img,video").onerror = () => c.classList.add("missing");
    c.onclick = e => {
      if(e.shiftKey && anchor>=0){ const a=Math.min(anchor,i), b=Math.max(anchor,i); sel=new Set(); for(let k=a;k<=b;k++) sel.add(k); }
      else if(e.ctrlKey || e.metaKey){ sel.has(i) ? sel.delete(i) : sel.add(i); anchor = i; }
      else { sel = new Set([i]); anchor = i; }
      refreshSel();
    };
    c.ondblclick = () => enterPresent(i);
    c.ondragstart = e => {
      if(!sel.has(i)){ sel = new Set([i]); anchor = i; refreshSel(); }
      dragIdx = i; e.dataTransfer.setData("text/x-slide","1"); e.dataTransfer.effectAllowed = "move";
    };
    c.ondragover = e => {
      if(dragIdx===null) return; e.preventDefault(); clearMarks();
      const r = c.getBoundingClientRect(); c.classList.add(e.clientX > r.left + r.width/2 ? "dropa" : "dropb");
    };
    c.ondrop = e => {
      if(dragIdx===null) return; e.preventDefault(); e.stopPropagation();
      const r = c.getBoundingClientRect();
      moveSel(i + (e.clientX > r.left + r.width/2 ? 1 : 0));
    };
    c.ondragend = () => { dragIdx = null; clearMarks(); };
    g.appendChild(c);
  });
  g.scrollTop = st;
}
const clearMarks = () => document.querySelectorAll(".dropa,.dropb").forEach(c=>c.classList.remove("dropa","dropb"));
$("grid").ondragover = e => { if(dragIdx!==null) e.preventDefault(); };
$("grid").ondrop = e => { if(dragIdx!==null){ e.preventDefault(); moveSel(SL().length); } };

function refreshSel(){
  document.querySelectorAll("#grid .card").forEach(c=>c.classList.toggle("sel", sel.has(+c.dataset.i)));
  renderInsp();
}
function moveSel(t){
  const S = SL(), idxs = [...sel].sort((a,b)=>a-b);
  t = Math.max(0, Math.min(S.length, t));
  snap();
  const items = idxs.map(i=>S[i]);
  const before = idxs.filter(i=>i<t).length;
  const rest = S.filter((_,i)=>!sel.has(i));
  const at = t - before;
  rest.splice(at,0,...items);
  deckData.slides = rest;
  sel = new Set(items.map((_,k)=>at+k)); anchor = at;
  dragIdx = null; renderGrid(); renderInsp(); save();
}

    ${fv?`<label class="chk"><input type="checkbox" id="iAuto" ${fv.autoplay!==false?"checked":""}> Play automatically</label>
    <label class="chk"><input type="checkbox" id="iLoop" ${fv.loop?"checked":""}> Loop</label>
    <label class="chk"><input type="checkbox" id="iMute" ${fv.muted?"checked":""}> Muted</label>`:""}
    <div class="row"><button class="btn" id="iL">Earlier</button><button class="btn" id="iR">Later</button></div>
    <button class="btn" id="iPres">Present from here</button>
    <button class="btn warn" id="iDel">Remove</button>`;
  $("iTr").onchange = e => { snap(); idx.forEach(i=>{ if(e.target.value) S[i].tr=e.target.value; else delete S[i].tr; }); renderGrid(); save(); };
  $("iAll").onclick = () => { const v=$("iTr").value; snap(); S.forEach(s=>{ if(v) s.tr=v; else delete s.tr; }); renderGrid(); save(); toast("Applied to all "+S.length+" slides"); };
  for(const [id,key] of [["iAuto","autoplay"],["iLoop","loop"],["iMute","muted"]]){
    const b = $(id); if(b) b.onchange = () => { snap(); idx.forEach(i=>{ if(S[i].video) S[i][key]=b.checked; }); save(); };
  }
  $("iL").onclick = () => moveSel(idx[0]-1);
  $("iR").onclick = () => moveSel(idx[idx.length-1]+2);
  $("iPres").onclick = () => enterPresent(idx[0]);
  if($("iArr")) $("iArr").onclick = () => openArrange(idx[0]);
  $("iDel").onclick = removeSel;
}

/* ---------- arranger: videos on top of a slide ---------- */
let arrIdx = -1, arrSel = -1;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const arrSlide = () => SL()[arrIdx];
function openArrange(i){
  arrIdx = i; arrSel = (arrSlide().overlays||[]).length ? 0 : -1;
  $("arrNum").textContent = String(i+1).padStart(2,"0");
  $("arr").classList.add("on"); buildArrange(); listExisting();
}
function closeArrange(){
  const s = arrSlide(); if(s && s.overlays && !s.overlays.length) delete s.overlays;
  $("arr").classList.remove("on"); arrIdx = -1; renderGrid(); renderInsp(); save();
}
function buildArrange(){
  const s = arrSlide(), st = $("arrStage"); st.innerHTML = "";
  st.style.setProperty("--ar", s.ar || 1.7778);
  const img = document.createElement("img"); img.src = s.img; img.alt = "";
  img.style.cssText = "position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none";
  img.onload = () => { if(!s.ar && img.naturalWidth) st.style.setProperty("--ar", img.naturalWidth/img.naturalHeight); };
  st.appendChild(img);
  (s.overlays||[]).forEach((o,k)=>st.appendChild(makeWrap(o,k)));
  renderArrSide();
}
function makeWrap(o,k){
  const w = document.createElement("div"); w.className = "ovw"+(k===arrSel?" sel":""); w.dataset.k = k; applyBox(w,o);
  const c = document.createElement("div"); c.className = "ov";
  const v = document.createElement("video"); v.src = o.video+"#t=0.1"; v.preload = "metadata"; v.muted = true; v.playsInline = true; v.style.pointerEvents = "none";
  applyVid(v,o); c.appendChild(v); w.appendChild(c);
  w.addEventListener("pointerdown", e => { if(e.target.dataset.h) return; arrSel = k; startDrag(e,k,"move"); });
  if(k===arrSel){
    ["nw","ne","se","sw"].forEach(n=>mkHandle(w,k,n,"c"));
    ["n","e","s","w"].forEach(n=>mkHandle(w,k,n,"e"));
  }
  return w;
}
function mkHandle(w,k,n,cls){
  const hd = document.createElement("i"); hd.className = "hd hd-"+n+" "+cls; hd.dataset.h = n;
  hd.addEventListener("pointerdown", e => { e.stopPropagation(); startDrag(e,k,n); });
  w.appendChild(hd);
}
function refreshWrap(k){
  const w = $("arrStage").querySelector('.ovw[data-k="'+k+'"]'), o = arrSlide().overlays[k];
  if(!w) return; applyBox(w,o); applyVid(w.querySelector("video"),o);
}
function startDrag(e,k,mode){
  e.preventDefault();
  const st = $("arrStage"), r = st.getBoundingClientRect(), o = arrSlide().overlays[k];
  snap();
  const start = {...o}, g0 = ovGeom(start);
  const px0 = (e.clientX-r.left)/r.width, py0 = (e.clientY-r.top)/r.height;
  const tgt = e.currentTarget; try{ tgt.setPointerCapture(e.pointerId); }catch(_){}
  if(!tgt.classList.contains("sel") || mode==="move"){ /* selection changes rebuild on release */ }
  const MIN = 0.03;
  const move = ev => {
    const px = (ev.clientX-r.left)/r.width, py = (ev.clientY-r.top)/r.height;
    if(mode==="move"){ o.x = start.x + (px-px0); o.y = start.y + (py-py0); }
    else if(mode.length===2){
      const right = mode.includes("e"), bottom = mode.includes("s");
      const ax = right ? g0.vx : g0.vx+g0.vw, ay = bottom ? g0.vy : g0.vy+g0.vh;
      let kk = Math.max(Math.abs(px-ax)/g0.vw, Math.abs(py-ay)/g0.vh);
      kk = clamp(kk, MIN/Math.min(g0.vw,g0.vh), 12);
      o.x = ax+(start.x-ax)*kk; o.y = ay+(start.y-ay)*kk; o.w = start.w*kk; o.h = start.h*kk;
    }else{
      if(mode==="w") o.cl = clamp((px-start.x)/start.w, 0, 1-(start.cr||0)-MIN/start.w);
      if(mode==="e") o.cr = clamp((start.x+start.w-px)/start.w, 0, 1-(start.cl||0)-MIN/start.w);
      if(mode==="n") o.ct = clamp((py-start.y)/start.h, 0, 1-(start.cb||0)-MIN/start.h);
      if(mode==="s") o.cb = clamp((start.y+start.h-py)/start.h, 0, 1-(start.ct||0)-MIN/start.h);
    }
    refreshWrap(k);
  };
  const up = () => {
    tgt.removeEventListener("pointermove",move); tgt.removeEventListener("pointerup",up); tgt.removeEventListener("pointercancel",up);
    buildArrange(); save();
  };
  tgt.addEventListener("pointermove",move); tgt.addEventListener("pointerup",up); tgt.addEventListener("pointercancel",up);
}
function renderArrSide(){
  const s = arrSlide(), ov = s.overlays||[], el = $("arrSide"), o = ov[arrSel];
  let html = "<h3>Videos on this slide</h3>";
  if(!ov.length) html += '<div class="dim">No video yet. Click <b>+ Add video file</b>, or pick one you already imported. Then drag it into place.</div>';
  html += ov.map((x,k)=>'<div class="ovitem'+(k===arrSel?" sel":"")+'" data-k="'+k+'">'+(k+1)+". "+x.video.split("/").pop()+"</div>").join("");
  if(o){
    html += `<label class="chk"><input type="checkbox" id="oAuto" ${o.autoplay!==false?"checked":""}> Play automatically</label>
      <label class="chk"><input type="checkbox" id="oLoop" ${o.loop?"checked":""}> Loop</label>
      <label class="chk"><input type="checkbox" id="oMute" ${o.muted!==false?"checked":""}> Muted</label>
      <label class="chk"><input type="checkbox" id="oCtl" ${o.controls?"checked":""}> Show player controls</label>
      <div class="row"><button class="btn" id="oReset">Reset crop</button><button class="btn" id="oFront">To front</button></div>
      <button class="btn warn" id="oDel">Remove video</button>
      <div class="dim">In Present mode, click the video to pause or play it. P pauses or plays every video on the slide. Arrow keys nudge the selected video.</div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll(".ovitem").forEach(d=>d.onclick=()=>{ arrSel = +d.dataset.k; buildArrange(); });
  if(!o) return;
  const bind = (id,key,inv) => { $(id).onchange = e => { snap(); o[key] = inv ? !e.target.checked : e.target.checked; save(); }; };
  $("oAuto").onchange = e => { snap(); o.autoplay = e.target.checked; save(); };
  $("oLoop").onchange = e => { snap(); o.loop = e.target.checked; save(); };
  $("oMute").onchange = e => { snap(); o.muted = e.target.checked; save(); };
  $("oCtl").onchange = e => { snap(); o.controls = e.target.checked; save(); };
  $("oReset").onclick = () => { snap(); o.cl=o.ct=o.cr=o.cb=0; buildArrange(); save(); };
  $("oFront").onclick = () => { snap(); const a=s.overlays; a.push(a.splice(arrSel,1)[0]); arrSel=a.length-1; buildArrange(); save(); };
  $("oDel").onclick = removeOv;
}
function removeOv(){
  const s = arrSlide(); if(!s.overlays || arrSel<0) return;
  snap(); s.overlays.splice(arrSel,1); arrSel = Math.min(arrSel, s.overlays.length-1); buildArrange(); save();
}
function arrKey(e){
  const tag = e.target.tagName;
  if(e.key==="Escape"){ closeArrange(); return; }
  if(tag==="INPUT"||tag==="SELECT") return;
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); if(arrIdx>=0) buildArrange(); return; }
  if(e.key==="Delete"||e.key==="Backspace"){ e.preventDefault(); removeOv(); return; }
  const o = (arrSlide().overlays||[])[arrSel]; if(!o) return;
  const d = e.shiftKey ? 0.01 : 0.002;
  const mv = {ArrowLeft:[-d,0],ArrowRight:[d,0],ArrowUp:[0,-d],ArrowDown:[0,d]}[e.key];
  if(mv){ e.preventDefault(); o.x+=mv[0]; o.y+=mv[1]; refreshWrap(arrSel); save(); }
}
function probeVideo(src){
  return new Promise(res=>{
    const v = document.createElement("video"); v.preload = "metadata";
    const done = r => { v.removeAttribute("src"); res(r); };
    v.onloadedmetadata = () => done(v.videoWidth && v.videoHeight ? v.videoWidth/v.videoHeight : 1.7778);
    v.onerror = () => done(1.7778);
    setTimeout(()=>done(1.7778), 5000);
    v.src = src;
  });
}
async function addOverlay(path){
  const s = arrSlide(); if(!s) return;
  const vr = await probeVideo(path);
  const ar = parseFloat(getComputedStyle($("arrStage")).getPropertyValue("--ar")) || 1.7778;
  let w = 0.4, hh = w*ar/vr; if(hh>0.8){ hh = 0.8; w = hh*vr/ar; }
  snap();
  (s.overlays = s.overlays||[]).push({video:path, x:(1-w)/2, y:(1-hh)/2, w, h:hh, vr, cl:0, ct:0, cr:0, cb:0, autoplay:true, loop:false, muted:true});
  arrSel = s.overlays.length-1; buildArrange(); save();
}
async function addOverlayFile(file){
  if(!await ready()) return;
  try{
    busy("Copying "+file.name+"...", .5);
    const d = await sub("assets/media");
    const ext = (file.name.match(/\.[^.]+$/)||[""])[0].toLowerCase();
    const name = await uniq(d, slug(file.name), ext);
    await putBlob(d,name,file);
    if(file.size > 95*1024*1024) toast(file.name+" is over 95 MB. GitHub rejects files over 100 MB, so compress it before publishing.");
    unbusy(); await addOverlay("assets/media/"+name);
  }catch(e){ unbusy(); toast("Could not add video: "+e.message); }
}
async function listExisting(){
  const sel = $("arrExisting"); sel.innerHTML = '<option value="">Choose...</option>';
  try{
    if(!dir || await dir.queryPermission({mode:"read"})!=="granted") return;
    const d = await dir.getDirectoryHandle("assets").then(a=>a.getDirectoryHandle("media"));
    for await (const [name,hd] of d.entries()){
      if(hd.kind==="file" && /\.(mp4|webm|mov|m4v|ogv)$/i.test(name)) sel.insertAdjacentHTML("beforeend", '<option value="assets/media/'+name+'">'+name+'</option>');
    }
  }catch(e){}
}
$("arrDone").onclick = closeArrange;
$("arrAdd").onclick = () => { if(!needsFolder()) $("ovIn").click(); };
$("ovIn").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if(f) addOverlayFile(f); };
$("arrExisting").onchange = e => { const v = e.target.value; e.target.value = ""; if(v) addOverlay(v); };
$("arrCanvas").addEventListener("pointerdown", e => { if(e.target.id==="arrCanvas" || e.target.id==="arrStage"){ arrSel = -1; buildArrange(); } });

/* ---------- keyboard ---------- */
addEventListener("keydown", e=>{
  const tag = e.target.tagName;
  if($("arr").classList.contains("on")){ arrKey(e); return; }
  if(document.body.classList.contains("mode-present")){
    if(tag==="VIDEO" && e.key===" ") return;
    if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ e.preventDefault(); next(); }
    else if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ e.preventDefault(); back(); }
    else if(e.key==="Home") go(0,-1);
    else if(e.key==="End") go(SL().length-1,1);
    else if(e.key==="f"||e.key==="F"){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
    else if(e.key==="p"||e.key==="P"){ const vs=els[cur] ? [...els[cur].querySelectorAll("video")] : []; const any=vs.some(v=>!v.paused); vs.forEach(v=>any ? v.pause() : v.play().catch(()=>{})); }
    else if(e.key==="Escape" && CAN_EDIT && !document.fullscreenElement) enterEdit();
    return;
  }
  if(tag==="INPUT"||tag==="SELECT") return;
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); }
  else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="a"){ e.preventDefault(); sel = new Set(SL().map((_,i)=>i)); refreshSel(); }
  else if(e.key==="Delete"||e.key==="Backspace"){ e.preventDefault(); removeSel(); }
  else if(e.key==="Enter" && sel.size){ enterPresent(Math.min(...sel)); }
  else if((e.key==="ArrowRight"||e.key==="ArrowLeft") && SL().length){
    e.preventDefault();
    const i = Math.max(0, Math.min(SL().length-1, (anchor<0?0:anchor) + (e.key==="ArrowRight"?1:-1)));
    sel = new Set([i]); anchor = i; refreshSel();
    const c = document.querySelector(`#grid .card[data-i="${i}"]`); if(c) c.scrollIntoView({block:"nearest"});
  }
});

/* ======================= START ======================= */
(async () => {
  if(CAN_EDIT){ dir = await idbGet("dir"); if(dir) await validRoot(); }
  const h = parseInt(location.hash.slice(1),10);
  if(!CAN_EDIT || h || /[?&]present\b/.test(location.search)) enterPresent((h||1)-1);
  else enterEdit();
})();
